
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build -- --base=/eletro-cadori/

      - name: Support direct navigation to application routes
        run: cp dist/index.html dist/404.html

      - name: Validate published base and product images
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync, readdirSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          const paths = [...html.matchAll(/(?:src|href)="([^"]+)"/g)]
            .map(match => match[1]).filter(path => path.startsWith('/'));
          assert(paths.length > 0, 'No local resources found');
          for (const path of paths) {
            assert(path.startsWith('/eletro-cadori/'), `Incorrect public base: ${path}`);
            assert(existsSync(`dist/${path.slice('/eletro-cadori/'.length)}`), `Missing resource: ${path}`);
          }
          const productDir = 'dist/images/produtos';
          assert(existsSync(productDir), 'Missing public/images/produtos output directory');
          const images = readdirSync(productDir).filter(name => /\.(jpe?g|png|webp)$/i.test(name));
          assert(images.length >= 125, `Expected at least 125 product images, found ${images.length}`);
          const catalog = readFileSync('src/lib/cadori.ts', 'utf8');
          for (const image of images) {
            if (catalog.includes(image)) {
              assert(existsSync(`${productDir}/${image}`), `Missing catalog image: ${image}`);
            }
          }
          assert.equal(readFileSync('dist/404.html', 'utf8'), html);
          console.log(`Public base, local resources, ${images.length} product images and route fallback validated`);
          NODE

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
